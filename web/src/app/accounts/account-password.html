<dialog #dialog (cancel)="dismiss()">
  @if (secret(); as shown) {
    <h2>{{ heading() }}</h2>
    <p class="hint">
      {{ t('accounts.password.onlyOnce') }}
    </p>
    <div class="secret">
      <input type="text" readonly [value]="shown" (focus)="$any($event.target).select()" />
      <button type="button" class="primary" (click)="copy()">
        {{ copied() ? t('common.copied') : t('common.copy') }}
      </button>
    </div>
    @if (failure(); as message) {
      <p class="failure" role="alert">{{ message }}</p>
    }
    <div class="actions">
      <button type="button" class="primary" (click)="dismiss()">{{ t('common.done') }}</button>
    </div>
  } @else {
    <form method="dialog" (submit)="$event.preventDefault(); submit()">
      <h2>{{ heading() }}</h2>
      <label>
        {{ t('common.password') }}
        <input
          type="text"
          autocomplete="off"
          spellcheck="false"
          [value]="draft()"
          (input)="draft.set($any($event.target).value)"
        />
      </label>
      <p class="hint">
        {{ t('accounts.password.hint') }}
      </p>
      <div class="actions">
        <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
        <button type="submit" class="primary" [disabled]="draft().length === 0">
          {{ action() ?? t('common.save') }}
        </button>
      </div>
    </form>
  }
</dialog>
