<dialog #dialog (cancel)="dismiss()">
  <form method="dialog" (submit)="$event.preventDefault(); submit()">
    <h2>{{ t('accounts.delete.heading', { email: account().email }) }}</h2>
    <label>
      {{ t('accounts.delete.files') }}
      <select [value]="recipient()" (change)="recipient.set($any($event.target).value)">
        <option value="">{{ t('accounts.delete.withAccount') }}</option>
        @for (other of candidates(); track other.id) {
          <option [value]="other.id">{{ t('accounts.delete.handTo', { name: other.display_name, email: other.email }) }}</option>
        }
      </select>
    </label>
    <p class="hint">
      {{ t('accounts.delete.hint', { usage: usage() }) }}
    </p>
    <div class="actions">
      <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
      <button type="submit" class="danger">{{ t('accounts.delete.submit') }}</button>
    </div>
  </form>
</dialog>
