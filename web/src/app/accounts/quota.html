<dialog #dialog (cancel)="dismiss()">
  <form method="dialog" (submit)="$event.preventDefault(); submit()">
    <h2>{{ t('accounts.quota.heading', { email: account().email }) }}</h2>
    <label>
      {{ t('accounts.quota.gigabytes') }}
      <input
        type="number"
        min="1"
        step="1"
        [value]="gigabytes()"
        (input)="gigabytes.set($any($event.target).value)"
      />
    </label>
    <p class="hint">
      {{ t('accounts.quota.hint') }}
    </p>
    @if (failure(); as message) {
      <p class="failure" role="alert">{{ message }}</p>
    }
    <div class="actions">
      <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
      <button type="submit" class="primary">{{ t('accounts.quota.submit') }}</button>
    </div>
  </form>
</dialog>
