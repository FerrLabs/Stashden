<dialog #dialog (cancel)="dismiss()">
  <form method="dialog" (submit)="$event.preventDefault(); submit()">
    <h2>{{ t('accounts.new.heading') }}</h2>

    <label>
      {{ t('common.emailAddress') }}
      <input
        type="email"
        autocomplete="off"
        required
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </label>

    <label>
      {{ t('accounts.new.displayName') }}
      <input
        type="text"
        autocomplete="off"
        required
        [value]="displayName()"
        (input)="displayName.set($any($event.target).value)"
      />
    </label>

    <label>
      {{ t('accounts.new.role') }}
      <select (change)="role.set($any($event.target).value)">
        @for (role of roles; track role) {
          <option [value]="role" [selected]="role === this.role()">{{ describe(role) }}</option>
        }
      </select>
    </label>

    <label>
      {{ t('accounts.new.firstPassword') }}
      <input
        type="text"
        autocomplete="off"
        spellcheck="false"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </label>
    <p class="hint">
      {{ t('accounts.new.hint') }}
    </p>

    <div class="actions">
      <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
      <button
        type="submit"
        class="primary"
        [disabled]="email().trim().length === 0 || displayName().trim().length === 0"
      >
        {{ t('accounts.new.submit') }}
      </button>
    </div>
  </form>
</dialog>
