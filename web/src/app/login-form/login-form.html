<form [formGroup]="form" (ngSubmit)="submit()">
  @if (methods()?.password !== false) {
    <label>
      {{ t('signIn.email') }}
      <input type="email" formControlName="email" autocomplete="username" required />
    </label>
    <label>
      {{ t('signIn.password') }}
      <input type="password" formControlName="password" autocomplete="current-password" required />
    </label>
    <button type="submit" class="primary" [disabled]="busy()">{{ busy() ? t('signIn.busy') : t('signIn.submit') }}</button>
    @if (methods()?.password_reset) {
      <a class="forgot" routerLink="/reset-password">{{ t('signIn.forgot') }}</a>
    }
  }
  @if (methods()?.oidc) {
    <button
      type="button"
      [class.primary]="methods()?.password === false"
      [disabled]="busy()"
      (click)="chooseProvider()"
    >
      {{ t('signIn.provider') }}
    </button>
  }
</form>
