<form [formGroup]="form" (ngSubmit)="submit()">
  @if (asks) {
    <label>
      Server
      <input
        type="url"
        formControlName="server"
        placeholder="https://stashden.example.com"
        required
        (blur)="serverLeft()"
      />
    </label>
  }
  @if (methods()?.password !== false) {
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" required />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" required />
    </label>
    <button type="submit" class="primary" [disabled]="busy()">{{ busy() ? 'Signing in' : 'Sign in' }}</button>
  }
  @if (methods()?.oidc) {
    <button
      type="button"
      [class.primary]="methods()?.password === false"
      [disabled]="busy()"
      (click)="chooseProvider()"
    >
      Sign in with your identity provider
    </button>
  }
</form>
