<dialog #dialog [attr.aria-labelledby]="titleId" (cancel)="close()">
  <header>
    <h2 class="name" [id]="titleId">{{ node().name }}</h2>
    <span class="meta">{{ size(node().size) }}</span>
    <button type="button" class="ghost" (click)="downloaded.emit()">{{ t('common.download') }}</button>
    <button type="button" class="ghost" [attr.aria-label]="t('files.preview.close')" (click)="close()">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path
          d="M5 5l10 10M15 5L5 15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </header>

  <div class="body">
    @if (loading()) {
      <p class="state" aria-busy="true">{{ t('files.preview.loading') }}</p>
    }
    @if (image(); as url) {
      <img [src]="url" [alt]="node().name" />
    }
    @if (pdf(); as url) {
      <iframe [src]="url" [title]="node().name"></iframe>
    }
    @if (text() !== null) {
      <pre><code>{{ text() }}</code></pre>
    }
    @if (message(); as reason) {
      <div class="state" [attr.role]="failed() ? 'alert' : null">
        <p>{{ reason }}</p>
        @if (failed()) {
          <div class="recovery">
            <button type="button" class="ghost" (click)="load()">{{ t('common.tryAgain') }}</button>
            <button type="button" class="ghost" (click)="downloaded.emit()">{{ t('common.download') }}</button>
          </div>
        }
      </div>
    }
  </div>
</dialog>
