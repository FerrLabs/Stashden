<nav [attr.aria-label]="t('files.breadcrumb.label')">
  <ol>
    <li>
      @if (segments().length === 0) {
        <span aria-current="page">{{ t('files.breadcrumb.root') }}</span>
      } @else {
        <a [routerLink]="link('')">{{ t('files.breadcrumb.root') }}</a>
      }
    </li>
    @for (segment of segments(); track segment.path; let last = $last) {
      <li>
        @if (last) {
          <span aria-current="page">{{ segment.name }}</span>
        } @else {
          <a [routerLink]="link(segment.path)">{{ segment.name }}</a>
        }
      </li>
    }
  </ol>
</nav>
