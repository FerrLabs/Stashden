<button
  #trigger
  type="button"
  class="icon action"
  aria-haspopup="menu"
  [attr.aria-expanded]="expanded()"
  [attr.aria-label]="t('files.action.openWith', { name: name() })"
  [title]="t('files.action.openWith', { name: name() })"
  [attr.tabindex]="reachable() ? null : -1"
  (click)="toggle()"
  (keydown)="onTriggerKey($event)"
>
  <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
    <path
      d="M5 7.5 10 12.5 15 7.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>
<div
  #menu
  popover="auto"
  role="menu"
  [attr.aria-label]="t('files.action.openWith', { name: name() })"
  (toggle)="onToggle($event)"
  (keydown)="onMenuKey($event)"
>
  @for (way of ways(); track way) {
    <button #item type="button" role="menuitem" tabindex="-1" (click)="choose(way)">
      @switch (way) {
        @case ('preview') {
          {{ t('files.openWith.preview') }}
        }
        @case ('download') {
          {{ t('common.download') }}
        }
      }
    </button>
  }
</div>
