<dialog #dialog (cancel)="dismiss()">
  <form method="dialog" (submit)="$event.preventDefault(); submit()">
    <h2>{{ t('password.heading') }}</h2>

    @if (needsFreshSignIn()) {
      <p class="hint">
        {{ t('password.freshSignIn') }}
      </p>
      @if (failure(); as message) {
        <p class="failure" role="alert">{{ message }}</p>
      }
      <div class="actions">
        <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
        <button type="button" class="primary" [disabled]="busy()" (click)="signInAgain()">
          {{ t('common.signInAgain') }}
        </button>
      </div>
    } @else {

    @if (asksCurrent()) {
      <label>
        {{ t('password.current') }}
        <input
          type="password"
          autocomplete="current-password"
          required
          [value]="current()"
          (input)="current.set($any($event.target).value)"
        />
      </label>
    }

    <label>
      {{ t('password.new') }}
      <input
        type="password"
        autocomplete="new-password"
        required
        minlength="12"
        [value]="replacement()"
        (input)="replacement.set($any($event.target).value)"
      />
    </label>
    <p class="hint">{{ t('password.hint') }}</p>

    @if (failure(); as message) {
      <p class="failure" role="alert">{{ message }}</p>
    }

    <div class="actions">
      <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
      <button
        type="submit"
        class="primary"
        [disabled]="busy() || (asksCurrent() && current().length === 0) || replacement().length === 0"
      >
        {{ busy() ? t('password.busy') : t('password.submit') }}
      </button>
    </div>
    }
  </form>
</dialog>
