<dialog #dialog (cancel)="dismiss()">
  <form method="dialog" (submit)="$event.preventDefault(); submit()">
    <h2>{{ t('deleteOwn.heading') }}</h2>
    <p class="hint">
      {{ t('deleteOwn.hint') }}
    </p>

    @if (needsFreshSignIn()) {
      <p class="hint">
        {{ t('deleteOwn.freshSignIn') }}
      </p>
      @if (failure(); as message) {
        <p class="failure" role="alert">{{ message }}</p>
      }
      <div class="actions">
        <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
        <button type="button" class="primary" [disabled]="busy()" (click)="signInAgain()">
          {{ t('common.signInAgain') }}
        </button>
      </div>
    } @else {
      <label>
        {{ t('deleteOwn.heir') }}
        <input
          type="email"
          autocomplete="off"
          [placeholder]="t('deleteOwn.heirPlaceholder')"
          [value]="heir()"
          (input)="heir.set($any($event.target).value)"
        />
      </label>

      @if (hasPassword()) {
        <label>
          {{ t('deleteOwn.password') }}
          <input
            type="password"
            autocomplete="current-password"
            required
            [value]="confirmation()"
            (input)="confirmation.set($any($event.target).value)"
          />
        </label>
      } @else {
        <label>
          {{ t('deleteOwn.address') }}
          <input
            type="email"
            autocomplete="off"
            required
            [value]="confirmation()"
            (input)="confirmation.set($any($event.target).value)"
          />
        </label>
      }

      @if (failure(); as message) {
        <p class="failure" role="alert">{{ message }}</p>
      }

      <div class="actions">
        <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
        <button type="submit" class="danger" [disabled]="busy() || confirmation().length === 0">
          {{ busy() ? t('deleteOwn.busy') : t('deleteOwn.submit') }}
        </button>
      </div>
    }
  </form>
</dialog>
