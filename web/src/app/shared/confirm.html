<dialog #dialog (cancel)="dismiss()">
  <h2>{{ heading() }}</h2>
  <p>{{ body() }}</p>
  <div class="actions">
    <button type="button" class="ghost" (click)="dismiss()">{{ t('common.cancel') }}</button>
    <button type="button" class="danger" (click)="accept()">{{ action() ?? t('common.confirm') }}</button>
  </div>
</dialog>
