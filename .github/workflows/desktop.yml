name: Desktop

# A release used to carry the API image and nothing a person could install, so
# the desktop app existed only for whoever cloned the repository and built it.
# This attaches the installers to the release instead.
#
# Kept out of ci.yml on purpose: a desktop bundle takes minutes and only means
# something once a version is published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v0.26.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: target/release/bundle/*-setup.exe
            signatures: target/release/bundle/*-setup.exe.sig
            format: nsis
            exe: .exe
          # An AppImage inherits the glibc of the machine that built it, so
          # this label is the oldest distribution Stashden runs on, not a
          # detail: 22.04 means glibc 2.35, which covers Debian 12 and Ubuntu
          # 22.04 alike. Raise it deliberately, and never to ubuntu-latest.
          - os: ubuntu-22.04
            bundles: target/release/bundle/*.AppImage
            signatures: target/release/bundle/*.AppImage.sig
            format: appimage
            exe: ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The published tag, not the head of main: main can move between the
          # release and this job, and the installer would then carry a version
          # number that matches nothing.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: GPUI needs its windowing and font headers, and the AppImage tooling needs file
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev patchelf file

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-packager from its pinned version, with no restored cache, since this job signs what it builds
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Sign the Windows installer when Azure Artifact Signing is fully configured, never when half of it is
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          names=(AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE)
          missing=()
          for name in "${names[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -eq ${#names[@]} ]; then
            message="Azure Artifact Signing is not configured, so this installer is unsigned and SmartScreen will warn on it."
            echo "::warning title=Unsigned Windows installer::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Half-configured signing::missing ${missing[*]}"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "command=artifact-signing-cli -e $AZURE_SIGNING_ENDPOINT -a $AZURE_SIGNING_ACCOUNT -c $AZURE_SIGNING_PROFILE %1" >> "$GITHUB_OUTPUT"
          fi

      - name: Put the newest x64 signtool from the Windows SDK on PATH
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'),
            (Join-Path $env:ProgramFiles 'Windows Kits/10/bin')
          )
          $found = foreach ($root in $roots) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                ForEach-Object {
                  $parsed = [version]'0.0.0.0'
                  if ([version]::TryParse($_.Directory.Parent.Name, [ref]$parsed)) {
                    [pscustomobject]@{ Version = $parsed; Dir = $_.Directory.FullName }
                  }
                }
            }
          }
          $best = $found | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $best) {
            Write-Error "no x64 signtool.exe under $($roots -join ' or ')"
            exit 1
          }
          Write-Host "signtool $($best.Version) at $($best.Dir)"
          Add-Content -Path $env:GITHUB_PATH -Value $best.Dir

      - name: Fetch artifact-signing-cli and refuse it unless its SHA-256 is the pinned one
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNING_CLI_VERSION: '0.11.0'
          SIGNING_CLI_SHA256: 'ddc6f6ef68631bf367ad051d7d37109e58d46095406e1fbba60d553b10f94393'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing-cli'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir 'artifact-signing-cli.exe'
          $url = "https://github.com/Levminer/artifact-signing-cli/releases/download/$env:SIGNING_CLI_VERSION/artifact-signing-cli.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:SIGNING_CLI_SHA256) {
            Write-Error "artifact-signing-cli $env:SIGNING_CLI_VERSION has SHA-256 $actual, expected $env:SIGNING_CLI_SHA256"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Bundle
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/update-signing.key"
          trap 'rm -f "$key"' EXIT
          python .workflow/.github/scripts/decrypt_update_key.py "$key"
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$key"
          cargo build --release --locked -p stashden-app
          cp "target/release/stashden-app$EXE" "target/release/Stashden$EXE"
          if [ -n "$SIGN_COMMAND" ]; then
            printf '\n[package.metadata.packager.windows]\nsign-command = %s\n' \
              "$(jq -Rn --arg command "$SIGN_COMMAND" '$command')" >> app/Cargo.toml
          fi
          cargo packager -p stashden-app --release --formats "$FORMAT"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ''
          APPIMAGE_EXTRACT_AND_RUN: '1'
          AZURE_TENANT_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.signing.outputs.enabled == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.signing.outputs.enabled == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          FORMAT: ${{ matrix.format }}
          EXE: ${{ matrix.exe }}
          SIGN_COMMAND: ${{ steps.signing.outputs.command }}

      - name: Refuse a Windows installer unless it carries a valid Authenticode signature from the expected publisher
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $installers = @(Get-ChildItem -Path target/release/bundle -Filter *-setup.exe)
          if ($installers.Count -eq 0) {
            Write-Error 'the bundle produced no installer'
            exit 1
          }
          if (-not $env:PUBLISHER) {
            $message = 'AZURE_SIGNING_PUBLISHER is empty, so any trusted signer passes. Set it to the certificate subject this step prints in the job log.'
            Write-Host "::warning title=Publisher not pinned::$message"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $message
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              Write-Error "$($installer.Name): $($signature.Status), $($signature.StatusMessage)"
              exit 1
            }
            $subject = $signature.SignerCertificate.Subject
            if ($env:PUBLISHER -and $subject -cne $env:PUBLISHER) {
              Write-Error "$($installer.Name) is signed by '$subject', expected '$env:PUBLISHER'"
              exit 1
            }
            Write-Host "$($installer.Name) signed by $subject"
          }

      # target/ is at the root of the repository, not under app/: every crate in
      # the workspace shares one output directory.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(${{ matrix.bundles }})
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "the bundle produced no installer" >&2
            ls -R target/release/bundle >&2 || true
            exit 1
          fi

          # The digest lets a careful person check a download before running
          # it, and it is the only check an unsigned Windows installer offers.
          for bundle in "${bundles[@]}"; do
            (cd "$(dirname "$bundle")" && sha256sum "$(basename "$bundle")" > "$(basename "$bundle").sha256")
          done

          # Without the detached signature the installer is still usable by
          # hand, but invisible to the updater, and that only shows up later,
          # when nobody is offered the next version.
          signatures=(${{ matrix.signatures }})
          if [ ${#signatures[@]} -eq 0 ]; then
            echo "the update signature is missing" >&2
            ls -R target/release/bundle >&2 || true
            exit 1
          fi

          printf 'uploading %s\n' "${bundles[@]}" "${signatures[@]}"
          gh release upload "$TAG" "${bundles[@]}" "${bundles[@]/%/.sha256}" "${signatures[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"

  # The app reads one manifest covering every platform, so it can only be
  # written once both installers are on the release.
  manifest:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write latest.json from the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,body > release.json

          named() {
            jq -r --arg suffix "$1" \
              '[.assets[] | select(.name | endswith($suffix))] | first | .name // ""' release.json
          }
          field() {
            jq -r --arg name "$1" --arg field "$2" \
              '[.assets[] | select(.name == $name) | .[$field]] | first // ""' release.json
          }

          windows=$(named '-setup.exe')
          linux=$(named '.AppImage')
          if [ -z "$windows" ] || [ -z "$linux" ]; then
            echo "expected both installers on $TAG" >&2
            jq -r '.assets[].name' release.json >&2
            exit 1
          fi

          # Read the two urls before fetching either: an absent signature
          # would otherwise reach gh as an empty argument, and set -e would
          # kill the step on a usage error instead of the message below.
          windows_signature_url=$(field "$windows.sig" apiUrl)
          linux_signature_url=$(field "$linux.sig" apiUrl)
          if [ -z "$windows_signature_url" ] || [ -z "$linux_signature_url" ]; then
            echo "an update signature is missing from $TAG" >&2
            jq -r '.assets[].name' release.json >&2
            exit 1
          fi

          windows_signature=$(gh api -H 'Accept: application/octet-stream' "$windows_signature_url")
          linux_signature=$(gh api -H 'Accept: application/octet-stream' "$linux_signature_url")
          if [ -z "$windows_signature" ] || [ -z "$linux_signature" ]; then
            echo "an update signature on $TAG is empty" >&2
            exit 1
          fi

          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(jq -r '.body // ""' release.json)" \
            --arg windows_url "$(field "$windows" url)" \
            --arg windows_signature "$windows_signature" \
            --arg linux_url "$(field "$linux" url)" \
            --arg linux_signature "$linux_signature" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": { signature: $windows_signature, url: $windows_url, format: "nsis" },
                "linux-x86_64": { signature: $linux_signature, url: $linux_url, format: "appimage" }
              }
            }' > latest.json

          jq '.platforms | map_values(.url)' latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
