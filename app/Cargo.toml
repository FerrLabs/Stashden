[package]
name = "stashden-app"
version.workspace = true
description = "Stashden desktop client"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.92"

[dependencies]
stashden-client = { workspace = true }
stashden-core = { workspace = true }

gpui-kit = "0.9.1"
tray-icon = { version = "0.26", default-features = false }
rfd = "0.18"
cargo-packager-updater = "0.2.3"
futures = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
keyring = "4"
gethostname = "1"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[lints]
workspace = true

[package.metadata.packager]
product-name = "Stashden"
identifier = "com.ferrlabs.roxycloud"
publisher = "FerrLabs"
homepage = "https://github.com/FerrLabs/Stashden"
out-dir = "../target/release/bundle"
binaries-dir = "../target/release"
binaries = [{ path = "Stashden", main = true }]
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
  "icons/icon.png",
]

[package.metadata.packager.nsis]
preinstall-section = """
Section RemoveRoxyCloud
  ReadRegStr $R8 SHCTX "Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\RoxyCloud" "UninstallString"
  ReadRegStr $R9 SHCTX "Software\\${MANUFACTURER}\\RoxyCloud" ""
  ${If} $R8 != ""
  ${AndIf} $R9 != ""
    DetailPrint "Removing the RoxyCloud install this replaces, keeping its data"
    ExecWait '$R8 /S _?=$R9' $R7
    ${If} $R7 = 0
      Delete "$R9\\uninstall.exe"
      RMDir "$R9"
      DeleteRegKey SHCTX "Software\\${MANUFACTURER}\\RoxyCloud"
    ${Else}
      DetailPrint "The RoxyCloud uninstaller exited with $R7, leaving it in place"
    ${EndIf}
  ${EndIf}
SectionEnd
"""
